<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ryan Hance — Skills Constellation</title>
  <meta name="description" content="An explorable map of Ryan Hance's complete professional skill set." />
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="./favicon-64.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <meta property="og:title" content="Ryan Hance — Skills Constellation" />
  <meta property="og:description" content="An explorable map of Ryan Hance's complete professional skill set." />
  <meta property="og:image" content="https://ryanlhance.github.io/skills/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <svg id="sky" aria-label="Interactive map of skills"></svg>
  <div id="root">
  <div class="chrome masthead">
    <h1 id="title">Ryan Hance's Skill Map</h1>
    <p class="sub">Select a star system to see categorical skills. Select a glowing star to receive more context.</p>
  </div>

  <div class="chrome searchbox">
    <input id="search" type="text" placeholder="Search skills..." autocomplete="off" spellcheck="false" />
    <div class="search-count" id="search-count"></div>
  </div>

  <div class="chrome legend">
    <div class="row"><span class="dot d3"></span> Signature Strength</div>
    <div class="row"><span class="dot d2"></span> Resume Backed Proof</div>
    <div class="row"><span class="dot d1"></span> Other Proven Skills</div>
  </div>

  <div class="chrome controls">
    <button id="reset" class="wide" title="Reset view">See All</button>
    <button id="zoom-out" title="Zoom out">−</button>
    <button id="zoom-in" title="Zoom in">+</button>
  </div>

  <aside class="dossier" id="dossier" aria-live="polite">
    <button class="dossier-close" id="dossier-close" aria-label="Close">×</button>
    <div class="dossier-scroll"></div>
  </aside>
  </div>

  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
